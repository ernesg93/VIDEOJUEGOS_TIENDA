<form class="d-flex" role="search" method="get" action="{% url 'buscador:resultados' %}">
    <input
        class="form-control me-2"
        type="search"
        name="q"
        placeholder="Buscar"
        aria-label="Buscar"
        value="{{ request.GET.q|default:'' }}"
    >
    <button class="btn btn-outline-primary" type="submit">
        <i class="fa-solid fa-magnifying-glass"></i>
    </button>
</form>
